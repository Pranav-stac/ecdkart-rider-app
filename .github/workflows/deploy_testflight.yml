name: Deploy iOS to TestFlight

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Override Build Number (optional)'
        required: false
        type: string

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false

jobs:
  ios-release:
    name: Build & Deploy to TestFlight
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'BV3K2HZZN7' }}
      IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
      IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Import Apple Codesigning Certificate
        if: env.IOS_DISTRIBUTION_CERT_BASE64 != '' && env.IOS_DISTRIBUTION_CERT_PASSWORD != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}

      - name: Install Provisioning Profile
        if: env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"

      - name: Configure CocoaPods & Xcode Signing
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};/g" Runner.xcodeproj/project.pbxproj 2>/dev/null || true
          pod install --repo-update
          cd ..

      - name: Build Release IPA
        id: build_ipa
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          BUILD_ARGS="--release --export-options-plist=ios/ExportOptions.plist"
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-number=$INPUT_BUILD_NUMBER"
          elif [ -n "${{ github.run_number }}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-number=${{ github.run_number }}"
          fi
          echo "Building IPA with: $BUILD_ARGS"
          flutter build ipa $BUILD_ARGS

      - name: Identify IPA Path
        id: ipa
        run: |
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Found IPA at: $IPA_PATH"
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore

      - name: Upload to TestFlight
        if: env.APP_STORE_CONNECT_ISSUER_ID != '' && env.APP_STORE_CONNECT_API_KEY_ID != '' && env.APP_STORE_CONNECT_API_PRIVATE_KEY != ''
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}