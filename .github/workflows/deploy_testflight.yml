name: Deploy iOS to TestFlight

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Override Build Number (optional)'
        required: false
        type: string

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false

jobs:
  ios-release:
    name: Build & Deploy to TestFlight
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || '655bf14b-54cb-4b8d-b335-15f5a9e48b9d' }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID || '87CDJ95N5V' }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'BV3K2HZZN7' }}
      BUNDLE_ID: 'com.ecdkart.rider'
      IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
      IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16.0 / 15.4
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          printf -- '%s\n' \
            "-----BEGIN PRIVATE KEY-----" \
            "MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgEaADG6HrgBnvKwSY" \
            "McVNR6Tv6RVXUoPaLHrsuy62TX6gCgYIKoZIzj0DAQehRANCAASga+OqYuSSUGs+" \
            "6IszNainK7sLiAtrf13iu4i31ACN0OPkfmTWtpUIdspYi7AASCCe2hD4oikPHv+3" \
            "anF+VUAd" \
            "-----END PRIVATE KEY-----" > ~/.appstoreconnect/private_keys/AuthKey_87CDJ95N5V.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_87CDJ95N5V.p8 ~/.private_keys/AuthKey_87CDJ95N5V.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_87CDJ95N5V.p8 ~/.private_keys/AuthKey_87CDJ95N5V.p8

      - name: Import Apple Codesigning Certificate (if provided)
        if: env.IOS_DISTRIBUTION_CERT_BASE64 != '' && env.IOS_DISTRIBUTION_CERT_PASSWORD != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}

      - name: Install Provisioning Profile (if provided)
        if: env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"

      - name: Fetch Distribution Certificate & Provisioning Profile via Fastlane
        run: |
          gem install fastlane --no-document
          fastlane run get_certificates \
            api_key_path:"$HOME/.appstoreconnect/private_keys/AuthKey_87CDJ95N5V.p8" \
            api_key_id:"$APP_STORE_CONNECT_API_KEY_ID" \
            api_key_issuer_id:"$APP_STORE_CONNECT_ISSUER_ID" \
            development:false || true

          fastlane run get_provisioning_profile \
            api_key_path:"$HOME/.appstoreconnect/private_keys/AuthKey_87CDJ95N5V.p8" \
            api_key_id:"$APP_STORE_CONNECT_API_KEY_ID" \
            api_key_issuer_id:"$APP_STORE_CONNECT_ISSUER_ID" \
            app_identifier:"$BUNDLE_ID" \
            force:true \
            adhoc:false || true

      - name: Configure CocoaPods & Xcode Signing
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};/g" Runner.xcodeproj/project.pbxproj 2>/dev/null || true
          pod install --repo-update
          cd ..

      - name: Build Flutter iOS Assets (No Code Signing)
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          BUILD_ARGS="--release --no-codesign"
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-number=$INPUT_BUILD_NUMBER"
          elif [ -n "${{ github.run_number }}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-number=${{ github.run_number }}"
          fi
          echo "Building Flutter assets with: $BUILD_ARGS"
          flutter build ios $BUILD_ARGS

      - name: Build & Export IPA via Fastlane Gym
        run: |
          mkdir -p build/ios/ipa
          fastlane gym \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner" \
            --clean false \
            --skip_codesigning true \
            --export_method "app-store" \
            --export_options "ios/ExportOptions.plist" \
            --output_directory "build/ios/ipa" \
            --output_name "Runner.ipa"

      - name: Identify IPA Path
        id: ipa
        run: |
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Found IPA at: $IPA_PATH"
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || '655bf14b-54cb-4b8d-b335-15f5a9e48b9d' }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID || '87CDJ95N5V' }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}