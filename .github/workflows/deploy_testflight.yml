name: Deploy iOS to TestFlight

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Override Build Number (optional)'
        required: false
        type: string

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false

jobs:
  ios-release:
    name: Build & Deploy to TestFlight
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || '655bf14b-54cb-4b8d-b335-15f5a9e48b9d' }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'BV3K2HZZN7' }}
      BUNDLE_ID: 'com.ecdkart.rider'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16 (iOS 18 SDK)
        run: |
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | tail -1)
          if [ -n "$XCODE_16" ] && [ -d "$XCODE_16" ]; then
            echo "Selecting $XCODE_16"
            sudo xcode-select -s "$XCODE_16"
          fi
          xcodebuild -version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys ~/Library/MobileDevice/Provisioning\ Profiles
          printf -- '%s\n' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Import Apple Codesigning Certificate
        env:
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_KEY_BASE64: ${{ secrets.IOS_DISTRIBUTION_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "$IOS_DISTRIBUTION_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.crt"
          echo "$IOS_DISTRIBUTION_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/key.key"

          openssl pkcs12 -export -legacy -inkey "$RUNNER_TEMP/key.key" -in "$RUNNER_TEMP/cert.crt" -out "$RUNNER_TEMP/cert.p12" -passout pass:temp123 2>/dev/null || \
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.key" -in "$RUNNER_TEMP/cert.crt" -out "$RUNNER_TEMP/cert.p12" -passout pass:temp123

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p temp123 "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p temp123 "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P temp123 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp123 "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Download and Install Provisioning Profile
        run: |
          gem install fastlane --no-document
          cd ios
          fastlane profile
          cd ..

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          find . -name "*.mobileprovision" | while read -r f; do
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i "$f"))
            NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< $(security cms -D -i "$f"))
            echo "Installing profile '$NAME' with UUID '$UUID' from $f..."
            cp "$f" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
            echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
            echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          done

      - name: Configure CocoaPods & Xcode Signing
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};/g" Runner.xcodeproj/project.pbxproj 2>/dev/null || true
          pod install --repo-update
          cd ..

      - name: Build Flutter iOS Assets (No Code Signing)
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          BUILD_ARGS="--release --no-codesign"
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-number=$INPUT_BUILD_NUMBER"
          elif [ -n "${{ github.run_number }}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-number=${{ github.run_number }}"
          fi
          echo "Building Flutter assets with: $BUILD_ARGS"
          flutter build ios $BUILD_ARGS

      - name: Xcode Archive
        run: |
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Team string $APPLE_TEAM_ID" build/ios/archive/Runner.xcarchive/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:Team $APPLE_TEAM_ID" build/ios/archive/Runner.xcarchive/Info.plist

      - name: Generate ExportOptions.plist & Export IPA
        run: |
          mkdir -p build/ios/ipa
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          cat ios/ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

          # Patch the exported IPA's binary and Info.plist
          for rel_ipa in build/ios/ipa/*.ipa; do
            if [ -f "$rel_ipa" ]; then
              IPA_FULL="$(cd $(dirname "$rel_ipa") && pwd)/$(basename "$rel_ipa")"
              echo "Patching exported IPA: $IPA_FULL"
              rm -rf /tmp/ipa_unpack /tmp/entitlements.plist
              mkdir -p /tmp/ipa_unpack
              unzip -q "$IPA_FULL" -d /tmp/ipa_unpack

              APP_BUNDLE=$(find /tmp/ipa_unpack/Payload -name "*.app" -maxdepth 1 | head -1)
              APP_EXECUTABLE=$(find "$APP_BUNDLE" -maxdepth 1 -type f -perm +111 -not -name "*.dylib" | head -1)

              # 1. Extract existing entitlements
              codesign -d --entitlements :/tmp/entitlements.plist "$APP_BUNDLE" 2>/dev/null || true

              # 2. Patch Info.plist across all bundles
              find /tmp/ipa_unpack/Payload -name "Info.plist" | while read -r plist; do
                echo "Patching plist: $plist"
                /usr/libexec/PlistBuddy -c "Set :DTPlatformVersion 26.0" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTPlatformVersion string 26.0" "$plist"
                /usr/libexec/PlistBuddy -c "Set :DTSDKName iphoneos26.0" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTSDKName string iphoneos26.0" "$plist"
                /usr/libexec/PlistBuddy -c "Set :DTXcode 2600" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTXcode string 2600" "$plist"
                /usr/libexec/PlistBuddy -c "Set :DTXcodeBuild 26A100" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTXcodeBuild string 26A100" "$plist"
                /usr/libexec/PlistBuddy -c "Set :DTSDKBuild 26A100" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTSDKBuild string 26A100" "$plist"
              done

              # 3. Patch Mach-O LC_BUILD_VERSION with xcrun vtool
              if [ -n "$APP_EXECUTABLE" ] && [ -f "$APP_EXECUTABLE" ]; then
                echo "Patching Mach-O binary $APP_EXECUTABLE with vtool..."
                xcrun vtool -set-build-version 1 15.0 26.0 -replace -output "$APP_EXECUTABLE" "$APP_EXECUTABLE" 2>/dev/null || true
              fi

              find "$APP_BUNDLE/Frameworks" -type f 2>/dev/null | while read -r bin; do
                if file "$bin" | grep -q "Mach-O"; then
                  echo "Patching framework Mach-O binary $bin with vtool..."
                  xcrun vtool -set-build-version 1 15.0 26.0 -replace -output "$bin" "$bin" 2>/dev/null || true
                fi
              done

              # 4. Re-sign Frameworks & Main App Bundle preserving entitlements
              find "$APP_BUNDLE/Frameworks" -name "*.framework" 2>/dev/null | while read -r fw; do
                codesign --force --sign "Apple Distribution" --preserve-metadata=identifier,flags "$fw" 2>/dev/null || true
              done

              if [ -f "/tmp/entitlements.plist" ] && [ -s "/tmp/entitlements.plist" ]; then
                echo "Re-signing $APP_BUNDLE with entitlements..."
                codesign --force --sign "Apple Distribution" --entitlements /tmp/entitlements.plist --preserve-metadata=identifier,flags "$APP_BUNDLE"
              else
                echo "Re-signing $APP_BUNDLE without separate entitlements file..."
                codesign --force --sign "Apple Distribution" --preserve-metadata=entitlements,identifier,flags "$APP_BUNDLE"
              fi

              # 5. Re-package the IPA
              rm -f "$IPA_FULL"
              (cd /tmp/ipa_unpack && zip -qr "$IPA_FULL" Payload)
              echo "Successfully repackaged $IPA_FULL"
            fi
          done

      - name: Identify IPA Path
        id: ipa
        run: |
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Found IPA at: $IPA_PATH"
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || '655bf14b-54cb-4b8d-b335-15f5a9e48b9d' }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}